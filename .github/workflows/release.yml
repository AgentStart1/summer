name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build daily APK
        run: ./gradlew assembleDaily

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: summer-daily
          path: app/build/outputs/apk/daily/*.apk
